<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="darkBlueBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#3B82F6" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" fill="url(#blueGrad)" filter="url(#blueGlow)"/>
  <!-- Hexagon Inner -->
  <polygon points="50,11 83,29.5 83,70.5 50,89 17,70.5 17,29.5" fill="url(#darkBlueBg)"/>
  <!-- Code Brackets & Star Icon -->
  <path d="M34 42 L26 48 L34 54" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M66 42 L74 48 L66 54" fill="none" stroke="#60A5FA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Star -->
  <polygon points="50,34 53,42 61,42 55,47 57,55 50,50 43,55 45,47 39,42 47,42" fill="#FBBF24"/>
  <!-- Text Label -->
  <text x="50" y="74" fill="#93C5FD" font-family="monospace" font-size="7" font-weight="900" text-anchor="middle" letter-spacing="0.5">POLYGLOT</text>
  <text x="50" y="83" fill="#60A5FA" font-family="monospace" font-size="6" font-weight="700" text-anchor="middle">C • PY • JAVA</text>
</svg>
