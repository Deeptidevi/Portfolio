<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="100%" stop-color="#CA8A04" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2E1A" />
      <stop offset="100%" stop-color="#0A140A" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#EAB308" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <!-- Hexagon Inner -->
  <polygon points="50,11 83,29.5 83,70.5 50,89 17,70.5 17,29.5" fill="url(#darkGrad)"/>
  <!-- HackerRank Green H icon -->
  <rect x="36" y="28" width="6" height="24" rx="2" fill="#2EC866"/>
  <rect x="58" y="28" width="6" height="24" rx="2" fill="#2EC866"/>
  <rect x="36" y="37" width="28" height="6" rx="1.5" fill="#2EC866"/>
  <!-- 5 Gold Stars at bottom of badge -->
  <g fill="url(#goldGrad)" transform="translate(0, 8)">
    <!-- Star 1 -->
    <polygon points="26,56 28,62 34,62 29,66 31,72 26,68 21,72 23,66 18,62 24,62" transform="scale(0.8) translate(6, 12)"/>
    <!-- Star 2 -->
    <polygon points="38,56 40,62 46,62 41,66 43,72 38,68 33,72 35,66 30,62 36,62" transform="scale(0.8) translate(10, 12)"/>
    <!-- Star 3 (Center) -->
    <polygon points="50,56 52,62 58,62 53,66 55,72 50,68 45,72 47,66 42,62 48,62" transform="scale(0.9) translate(5, 5)"/>
    <!-- Star 4 -->
    <polygon points="62,56 64,62 70,62 65,66 67,72 62,68 57,72 59,66 54,62 60,62" transform="scale(0.8) translate(16, 12)"/>
    <!-- Star 5 -->
    <polygon points="74,56 76,62 82,62 77,66 79,72 74,68 69,72 71,66 66,62 72,62" transform="scale(0.8) translate(20, 12)"/>
  </g>
  <!-- Text Label -->
  <text x="50" y="80" fill="#EAB308" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="1">C++ GOLD</text>
</svg>
