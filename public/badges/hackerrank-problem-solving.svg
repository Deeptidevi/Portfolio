<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="bgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#10B981" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Hexagon Outer -->
  <polygon points="50,6 88,27 88,73 50,94 12,73 12,27" fill="url(#emeraldGrad)" filter="url(#emeraldGlow)"/>
  <!-- Hexagon Inner -->
  <polygon points="50,11 83,29.5 83,70.5 50,89 17,70.5 17,29.5" fill="url(#bgDark)"/>
  <!-- Certificate Shield Icon -->
  <path d="M50 24 L68 32 V50 C68 62 50 72 50 72 C50 72 32 62 32 50 V32 Z" fill="#10B981" opacity="0.2"/>
  <path d="M50 27 L65 34 V49 C65 59 50 67 50 67 C50 67 35 59 35 49 V34 Z" fill="none" stroke="#34D399" stroke-width="2"/>
  <!-- Checkmark -->
  <path d="M42 46 L48 52 L58 40" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Text Label -->
  <text x="50" y="80" fill="#34D399" font-family="monospace" font-size="7.5" font-weight="900" text-anchor="middle" letter-spacing="0.5">CERTIFIED</text>
</svg>
