<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
    <linearGradient id="medalDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B0764" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <filter id="purpleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#8B5CF6" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Outer Circular Ring / Medal -->
  <circle cx="50" cy="50" r="44" fill="url(#purpleGrad)" filter="url(#purpleGlow)"/>
  <circle cx="50" cy="50" r="39" fill="url(#medalDark)"/>
  <circle cx="50" cy="50" r="35" fill="none" stroke="#A855F7" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Gold 1-Star Symbol -->
  <polygon points="50,26 55,38 68,38 58,46 62,59 50,51 38,59 42,46 32,38 45,38" fill="#FBBF24" stroke="#F59E0B" stroke-width="1"/>
  <!-- Text Label -->
  <text x="50" y="73" fill="#E9D5FF" font-family="monospace" font-size="8" font-weight="900" text-anchor="middle" letter-spacing="0.5">CODECHEF</text>
  <text x="50" y="82" fill="#FBBF24" font-family="monospace" font-size="7" font-weight="700" text-anchor="middle">★ 1-STAR</text>
</svg>
